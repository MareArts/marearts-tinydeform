[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marearts-tinydeform"
version = "0.1.1"
description = "Fused value projection + multi-scale deformable attention for DETR-style decoders (CUDA, inference)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "MareArts" }]
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://www.marearts.com"
Repository = "https://github.com/MareArts/marearts-tinydeform"

[tool.setuptools]
packages = ["marearts_tinydeform"]
